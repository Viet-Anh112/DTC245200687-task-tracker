name: task-tracker

services:
  # ---------- Reverse proxy ----------
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: tt-nginx
    restart: unless-stopped
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx:mode=1777]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ---------- Ung dung web ----------
  app:
    build: ./app
    image: task-tracker-app:1.0
    container_name: tt-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: tt_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend, monitoring]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100

  # ---------- Database + cong cu quan ly ----------
  db:
    image: postgres:16-alpine
    container_name: tt-db
    restart: unless-stopped
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on",
              "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]            # mang internal, khong ra Internet
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports: ["127.0.0.1:5050:80"]   # chi truy cap tu may host
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # ---------- Monitoring ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tt-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tt-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
     - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: tt-cadvisor
    restart: unless-stopped
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices: ["/dev/kmsg"]
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: tt-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [frontend, monitoring]
    read_only: true
    cap_drop: [ALL]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tt-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://tt_monitor:${MONITOR_DB_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db: { condition: service_healthy }
    networks: [backend, monitoring]
    read_only: true
    cap_drop: [ALL]

  # ---------- Log tap trung ----------
  loki:
    image: grafana/loki:3.1.1
    container_name: tt-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.1.1
    container_name: tt-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./logging/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on: [loki]
    networks: [monitoring]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true               # Network isolation: DB khong co duong ra ngoai
  monitoring:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
