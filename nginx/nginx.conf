worker_processes auto;
pid /tmp/nginx.pid; # Non-root: Ghi file PID vao /tmp co quyen ghi

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off; # An thong tin phien ban Nginx

  # Dinh dang log JSON de Promtail/Loki phan tich
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"user_agent":"$http_user_agent"}';

  access_log /dev/stdout json_combined;
  error_log  /dev/stderr warn;

  # Gioi han tan suat yeu cau (Rate limiting)
  limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

  # Thu muc tam thoi trong /tmp (tuong thich read_only: true)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  upstream tt_app {
    server app:3000;
    keepalive 16;
  }

  # Chuyen huong HTTP (8080) sang HTTPS (8443)
  server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Reverse Proxy HTTPS (8443)
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Cac Security Headers theo khuyen nghi OWASP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 1m;

    # Chan truy cap /metrics tu Internet (chi cho phep Prometheus noi bo)
    location = /metrics {
      return 404;
    }

    location / {
      limit_req zone=req_limit burst=20 nodelay;
      proxy_pass http://tt_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Cong noi bo 8081 cho nginx-prometheus-exporter doc stub_status
  server {
    listen 8081;
    location = /stub_status {
      stub_status;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
    }
  }
}
